name: test

on:
  push:
  pull_request:

jobs:
  bats:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh dash jq shellcheck
          # Distro bats is too old (1.2); the suite needs >= 1.5.
          git clone --depth 1 --branch v1.11.0 https://github.com/bats-core/bats-core.git /tmp/bats
          sudo /tmp/bats/install.sh /usr/local
      - name: Install test dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core jq shellcheck
      - name: bats
        run: bats tests/
      - name: shellcheck
        # Advisory until the inherited scripts have a clean baseline.
        continue-on-error: true
        run: |
          find . -path ./.git -prune -o -type f -name '*.sh' -print \
            | xargs shellcheck --shell=sh --severity=warning
