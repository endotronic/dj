name: test

on:
  push:
  pull_request:

jobs:
  bats:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh dash jq shellcheck
          # The recipe tests run `just`; take a pinned release rather than
          # whatever version the runner's distro happens to package.
          curl -fsSL https://just.systems/install.sh \
            | sudo bash -s -- --tag 1.59.0 --to /usr/local/bin
          # Distro bats is too old (1.2); the suite needs >= 1.5.
          git clone --depth 1 --branch v1.11.0 https://github.com/bats-core/bats-core.git /tmp/bats
          sudo /tmp/bats/install.sh /usr/local
      - name: Install test dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core jq just shellcheck
      - name: bats
        # Each failing test also becomes an annotation (title = the test,
        # body = bats' diagnostics), so failures read without the log.
        run: |
          set +e
          bats tests/ 2>&1 | tee "$RUNNER_TEMP/bats.out"
          status=${PIPESTATUS[0]}
          awk '
            function flush() {
              if (name != "") {
                gsub(/%/, "%25", body); gsub(/\r/, "", body); gsub(/\n/, "%0A", body)
                printf "::error title=%s::%s\n", name, body
              }
              name = ""; body = ""
            }
            /^not ok / { flush(); name = $0; sub(/^not ok [0-9]+ /, "", name); gsub(/[:,]/, " ", name); next }
            /^(ok|not ok) / { flush(); next }
            name != "" && /^#/ { body = body substr($0, 3) "\n" }
            END { flush() }
          ' "$RUNNER_TEMP/bats.out"
          exit "$status"
      - name: shellcheck
        # Advisory until the inherited scripts have a clean baseline.
        continue-on-error: true
        run: |
          find . -path ./.git -prune -o -type f -name '*.sh' -print \
            | xargs shellcheck --shell=sh --severity=warning
